title = "solo"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private or CGNAT IPv4 address"
regex = '''\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}\b'''
tags = ["privacy"]

[[rules]]
id = "home-path"
description = "Absolute home-directory path"
# The secret excludes the leading slash: the default allowlist skips matches that start with /home/ or /Users/.
regex = '''/((?:home|Users)/[A-Za-z][\w.-]*)/'''
secretGroup = 1
tags = ["privacy"]
